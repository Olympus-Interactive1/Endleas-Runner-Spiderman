<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>THWIP! — Ağ Atma Oyunu 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{ --red:#e62429; --blue:#2f4bd6; --gold:#ffd23f; --ink:#12071f; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    position:fixed; inset:0; width:100%; height:100%; overflow:hidden;
    background:#1b1035; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    touch-action:none; font-family:'Nunito',sans-serif;
  }
  #stage{ position:fixed; inset:0; touch-action:none; }
  #skybg{ position:absolute; inset:0; z-index:0; }
  #gl{ position:absolute; inset:0; z-index:1; display:block; touch-action:none; }
  #fx{ position:absolute; inset:0; z-index:2; pointer-events:none; }
  .overlay,.hud,button{ touch-action:none; }

  .hud{
    position:absolute; left:0; right:0; top:0; z-index:5; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0 16px;
  }
  .dist{
    font-family:'Bangers','Comic Sans MS',cursive; letter-spacing:2px;
    font-size:clamp(36px,8vw,58px); color:#fff; line-height:.95;
    text-shadow:3px 3px 0 #12071f,-2px -2px 0 #12071f,2px -2px 0 #12071f,-2px 2px 0 #12071f;
    transform:rotate(-2deg);
  }
  .bestline{
    font-weight:900; font-size:clamp(12px,3.4vw,16px); color:var(--gold);
    text-shadow:2px 2px 0 #12071f; margin-top:4px; letter-spacing:.5px;
  }
  .hudright{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .chip{
    display:inline-flex; align-items:center; gap:7px;
    background:#fff; border:3px solid #12071f; box-shadow:4px 4px 0 rgba(18,7,31,.85);
    padding:5px 12px; font-weight:900; font-size:clamp(14px,4vw,18px); color:#12071f;
    transform:rotate(1.5deg);
  }
  #muteBtn{
    pointer-events:auto; cursor:pointer; width:46px; height:46px;
    background:#fff; border:3px solid #12071f; box-shadow:4px 4px 0 rgba(18,7,31,.85);
    font-size:20px; display:flex; align-items:center; justify-content:center;
    transform:rotate(-2deg); transition:transform .08s;
  }
  #muteBtn:active{ transform:rotate(-2deg) translate(2px,2px); box-shadow:2px 2px 0 rgba(18,7,31,.85); }

  #hint{
    position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 26px); z-index:5;
    transform:translateX(-50%); pointer-events:none; text-align:center;
    background:rgba(18,7,31,.72); color:#fff; font-weight:900;
    font-size:clamp(13px,3.8vw,17px); padding:10px 18px; border:2px solid rgba(255,255,255,.25);
    border-radius:40px; white-space:nowrap; opacity:0;
  }
  #hint.show{ animation:hintFade 5.5s forwards; }
  @keyframes hintFade{ 0%{opacity:0; transform:translateX(-50%) translateY(14px);} 8%{opacity:1; transform:translateX(-50%) translateY(0);} 78%{opacity:1;} 100%{opacity:0;} }

  .overlay{
    position:absolute; inset:0; z-index:6; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
    padding:24px; cursor:pointer;
    background:
      radial-gradient(rgba(255,255,255,.09) 1.4px, transparent 1.6px) 0 0/12px 12px,
      linear-gradient(180deg, rgba(18,7,31,.5), rgba(18,7,31,.08) 30%, rgba(18,7,31,.08) 68%, rgba(18,7,31,.55));
  }
  .hide{ display:none !important; }

  .logo{
    font-family:'Bangers','Comic Sans MS',cursive; letter-spacing:4px;
    font-size:clamp(70px,21vw,170px); color:var(--red); line-height:.9;
    transform:rotate(-4deg);
    text-shadow:0 5px 0 #7c0f13, 5px 5px 0 #12071f, 9px 9px 0 rgba(18,7,31,.35);
    animation:logoIn .6s cubic-bezier(.2,1.6,.4,1) both, logoFloat 3.2s 0.6s ease-in-out infinite;
  }
  @keyframes logoIn{ from{ transform:rotate(-14deg) scale(.3); opacity:0; } to{ transform:rotate(-4deg) scale(1); opacity:1; } }
  @keyframes logoFloat{ 0%,100%{ transform:rotate(-4deg) translateY(0);} 50%{ transform:rotate(-3deg) translateY(-8px);} }
  .tagline{
    font-family:'Bangers',cursive; letter-spacing:2px; font-size:clamp(18px,5vw,28px);
    background:var(--blue); color:#fff; border:3px solid #12071f;
    box-shadow:5px 5px 0 rgba(18,7,31,.85); padding:6px 18px; transform:rotate(1.5deg);
  }
  .tagline.small{ font-size:clamp(12px,3.4vw,16px); background:var(--gold); color:#12071f; }
  .menuBest{
    font-weight:900; color:var(--gold); font-size:clamp(15px,4.4vw,20px);
    text-shadow:2px 2px 0 #12071f; letter-spacing:1px;
  }
  .prompt{
    font-family:'Bangers',cursive; letter-spacing:2px; color:#fff;
    font-size:clamp(20px,6vw,32px); text-shadow:3px 3px 0 #12071f;
    animation:blink 1.1s steps(2) infinite; margin-top:5vh;
  }
  @keyframes blink{ 50%{ opacity:.15; } }
  .howto{
    font-weight:900; color:rgba(255,255,255,.92); font-size:clamp(12px,3.6vw,15px);
    background:rgba(18,7,31,.6); border:2px solid rgba(255,255,255,.22);
    padding:8px 16px; border-radius:30px;
  }

  .panel{
    background:#fff8ec; border:4px solid #12071f; box-shadow:10px 10px 0 rgba(18,7,31,.85);
    padding:26px 34px 30px; transform:rotate(-2deg); max-width:min(88vw,420px);
    background-image:radial-gradient(rgba(18,7,31,.08) 1.4px, transparent 1.6px);
    background-size:11px 11px; animation:panelIn .45s cubic-bezier(.2,1.7,.4,1) both;
    cursor:default;
  }
  @keyframes panelIn{ from{ transform:rotate(-9deg) scale(.4); opacity:0;} to{ transform:rotate(-2deg) scale(1); opacity:1;} }
  .overTitle{
    font-family:'Bangers',cursive; letter-spacing:3px; color:var(--red);
    font-size:clamp(38px,11vw,58px); line-height:.95; text-shadow:3px 3px 0 #12071f;
  }
  .newRecord{
    font-family:'Bangers',cursive; letter-spacing:2px; font-size:clamp(18px,5vw,24px);
    color:#12071f; background:var(--gold); border:3px solid #12071f;
    display:inline-block; padding:3px 14px; transform:rotate(-3deg); margin-top:8px;
    animation:recPulse .7s ease-in-out infinite alternate;
  }
  @keyframes recPulse{ to{ transform:rotate(-3deg) scale(1.1);} }
  .overDist{
    font-family:'Bangers',cursive; letter-spacing:2px;
    font-size:clamp(46px,13vw,70px); color:var(--blue); text-shadow:3px 3px 0 #12071f;
    margin:8px 0 2px; line-height:1;
  }
  .stats{ display:flex; justify-content:center; gap:22px; font-weight:900; color:#12071f; font-size:clamp(13px,3.8vw,16px); margin-bottom:16px; }
  .btn{
    pointer-events:auto; cursor:pointer; font-family:'Bangers',cursive; letter-spacing:2px;
    font-size:clamp(20px,6vw,28px); color:#fff; background:var(--red);
    border:4px solid #12071f; box-shadow:6px 6px 0 #12071f; padding:10px 26px;
    transform:rotate(-1deg); transition:transform .08s, box-shadow .08s;
  }
  .btn:active{ transform:rotate(-1deg) translate(4px,4px); box-shadow:2px 2px 0 #12071f; }
  .btn.ghost{ background:#fff; color:#12071f; font-size:clamp(16px,4.6vw,20px); padding:8px 18px; }
  .btnrow{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center; }

  #errBox{
    position:fixed; left:10px; bottom:10px; z-index:999; display:none;
    background:#12071f; color:#ff6b6b; font:11px/1.4 monospace;
    padding:8px 10px; border:1px solid #ff6b6b; max-width:92vw; pointer-events:none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="skybg"></div>
  <canvas id="gl"></canvas>
  <canvas id="fx"></canvas>

  <div class="hud" id="hud" style="display:none">
    <div>
      <div class="dist" id="distEl">0 m</div>
      <div class="bestline" id="bestEl">REKOR 0 m</div>
    </div>
    <div class="hudright">
      <button id="muteBtn" aria-label="ses aç/kapat">🔊</button>
      <div class="chip"><span class="spider">🕷️</span><span id="tokenEl">0</span></div>
    </div>
  </div>

  <div id="hint">👆 BASILI TUT: ağ at &amp; sallan &nbsp;•&nbsp; BIRAK: fırla!</div>

  <div class="overlay" id="menu">
    <div class="logo">THWIP!</div>
    <div class="tagline">AĞ ATMA OYUNU</div>
    <div class="tagline small">✦ 3D ŞEHİR SÜRÜMÜ ✦</div>
    <div class="menuBest" id="menuBest">REKOR: 0 m</div>
    <div class="prompt">BAŞLAMAK İÇİN EKRANA DOKUN</div>
    <div class="howto">Basılı tut → ağ atılır &nbsp;•&nbsp; Bırak → ileri fırlarsın</div>
  </div>

  <div class="overlay hide" id="over">
    <div class="panel">
      <div class="overTitle">OYUN BİTTİ!</div>
      <div class="hide newRecord" id="newRec">★ YENİ REKOR! ★</div>
      <div class="overDist" id="overDist">0 m</div>
      <div class="stats">
        <div>🕷️ Jeton: <span id="overTok">0</span></div>
        <div>🕸️ Ağ: <span id="overWeb">0</span></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="btnRetry">TEKRAR SALLAN</button>
        <button class="btn ghost" id="btnMenu">MENÜ</button>
      </div>
    </div>
  </div>

  <div class="overlay hide" id="pauseOverlay">
    <div class="overTitle" style="color:#fff">DURAKLATILDI</div>
    <div class="prompt">DEVAM İÇİN DOKUN</div>
  </div>
</div>
<div id="errBox"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
function showErr(msg){ try{ var el=document.getElementById('errBox'); if(el){ el.style.display='block'; el.textContent='HATA: '+msg; } }catch(e){} }
window.addEventListener('error', function(e){ showErr(e.message||'bilinmeyen hata'); });

const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ================= SABİTLER (y-yukarı dünya) ================= */
const GRAV=1600, MAX_SPEED=2350, BOOST=520;
const ROOF_TOP=180;
let W=0,H=0,dpr=1;

/* ================= SES ================= */
let AC=null, master=null, noiseBuf=null;
let muted = store.get('thwip_mute')==='1';
function ensureAudio(){
  if(!AC){ try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }catch(e){} }
  if(AC && AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
}
function noiseSrc(){ const s=AC.createBufferSource(); s.buffer=noiseBuf; return s; }
function sThwip(){ if(!AC||muted)return; try{ const t=AC.currentTime;
  const n=noiseSrc(), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='bandpass'; f.frequency.setValueAtTime(2200,t); f.frequency.exponentialRampToValueAtTime(500,t+.09); f.Q.value=1.2;
  g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+.12);
  const o=AC.createOscillator(), g2=AC.createGain(); o.type='square';
  o.frequency.setValueAtTime(1300,t); o.frequency.exponentialRampToValueAtTime(240,t+.08);
  g2.gain.setValueAtTime(.14,t); g2.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(g2); g2.connect(master); o.start(t); o.stop(t+.1);
}catch(e){} }
function tone(freq,t0,dur,type,vol){ const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.2,t0); g.gain.exponentialRampToValueAtTime(.001,t0+dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0+dur+.02); }
function sDing(){ if(!AC||muted)return; try{ const t=AC.currentTime; tone(784,t,.1,'sine',.22); tone(1175,t+.06,.14,'sine',.2); }catch(e){} }
function sPerfect(){ if(!AC||muted)return; try{ const t=AC.currentTime; tone(523,t,.07,'square',.14); tone(659,t+.06,.07,'square',.14); tone(880,t+.12,.12,'square',.14); }catch(e){} }
function sCrash(){ if(!AC||muted)return; try{ const t=AC.currentTime;
  const n=noiseSrc(), f=AC.createBiquadFilter(), g=AC.createGain();
  f.type='lowpass'; f.frequency.value=340; g.gain.setValueAtTime(.7,t); g.gain.exponentialRampToValueAtTime(.001,t+.4);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+.45);
  tone(120,t,.3,'sine',.4);
}catch(e){} }
function sUi(){ if(!AC||muted)return; try{ tone(660,AC.currentTime,.06,'square',.12); }catch(e){} }

/* ================= DURUM ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
function rnd(i,s){ const x=Math.sin(i*127.1+s*311.7)*43758.5453; return x-Math.floor(x); }
function cssMix(c1,c2,k){ return 'rgb('+Math.round(lerp(c1[0],c2[0],k))+','+Math.round(lerp(c1[1],c2[1],k))+','+Math.round(lerp(c1[2],c2[2],k))+')'; }

const game = { state:'menu', t:0, night:0, shake:0 };
const p = { x:120, y:ROOF_TOP+28, vx:0, vy:0, state:'stand', attached:false, anchor:null, ropeLen:0 };
let anchors=[], tokens=[], popups=[], trail=[];
let camCX=0, camCY=380, dtG=0.016;
let startX=120, maxX=120, meters=0, best=+(store.get('thwip_best')||0);
let tokenCount=0, webCount=0, combo=0, deadTimer=0, firstRun=true, paused=false, lastT=0;
let holdSeek=false, seekDelay=0, releaseCooldown=0, flash=0;

/* ================= DOM ================= */
const $=id=>document.getElementById(id);
const hud=$('hud'), distEl=$('distEl'), bestEl=$('bestEl'), tokenEl=$('tokenEl'), hintEl=$('hint'),
      menuEl=$('menu'), overEl=$('over'), pauseEl=$('pauseOverlay'), menuBest=$('menuBest'),
      muteBtn=$('muteBtn'), skybg=$('skybg');
function refreshMute(){ muteBtn.textContent = muted?'🔇':'🔊'; }
refreshMute();
muteBtn.addEventListener('click', e=>{ e.stopPropagation(); muted=!muted; store.set('thwip_mute', muted?'1':'0'); refreshMute(); if(!muted){ensureAudio(); sUi();} });
$('btnRetry').addEventListener('click', e=>{ e.stopPropagation(); ensureAudio(); sUi(); restart(); });
$('btnMenu').addEventListener('click', e=>{ e.stopPropagation(); sUi(); toMenu(); });
menuBest.textContent='REKOR: '+best+' m';
bestEl.textContent='REKOR '+best+' m';

/* ================= DÜNYA ÜRETİMİ ================= */
function addAnchor(){
  const prev = anchors.length? anchors[anchors.length-1] : {x:200,y:470};
  const k = clamp(prev.x/24000, 0, 1);
  const gap = 245 + Math.random()*115 + k*95;
  const x = prev.x + gap;
  let y = 380 + Math.random()*260;
  if(Math.abs(y-prev.y)<45) y = clamp(prev.y + (Math.random()<.5?-1:1)*90, 370, 650);
  anchors.push({x, y});
  if(Math.random()<.68){
    const mx=(prev.x+x)/2;
    let ty=Math.min(prev.y,y) - 235 - Math.random()*85;
    ty=Math.max(ty, 135);
    tokens.push({x:mx, y:ty, taken:false});
    if(Math.random()<.28){ tokens.push({x:mx-75, y:ty-18, taken:false}); tokens.push({x:mx+75, y:ty-18, taken:false}); }
  }
}
function genWorld(){
  if(!anchors.length) anchors.push({x:410, y:530});
  while(anchors[anchors.length-1].x < camCX + 1400) addAnchor();
  while(anchors.length && anchors[0].x < camCX - 1200) anchors.shift();
  while(tokens.length && tokens[0].x < camCX - 1200) tokens.shift();
}

/* ================= AKIŞ ================= */
function bestAnchor(){
  let bestA=null, bs=1e9;
  for(let i=0;i<anchors.length;i++){
    const a=anchors[i], dx=a.x-p.x, dy=a.y-p.y;
    if(dx<-70||dx>560||dy<90) continue;
    const d2=dx*dx+dy*dy;
    if(d2 > 560*560) continue;
    const maxLen = Math.min(560, a.y-30);
    if(Math.sqrt(d2) > maxLen+160) continue;
    let score = Math.abs(dx-150) + Math.abs(dy-330)*.55;
    if(dx<0) score+=140;
    if(score<bs){ bs=score; bestA=a; }
  }
  return bestA;
}
function spawnBurst(x,y,n,col,spread,up){
  for(let i=0;i<n;i++){
    sparkSet(x,y,(Math.random()-.5)*spread, up+Math.random()*up, col);
  }
}
function attach(a){
  const dx=a.x-p.x, dy=a.y-p.y, d=Math.hypot(dx,dy);
  const maxLen = Math.min(560, a.y-30);
  p.ropeLen = clamp(d, 150, maxLen);
  p.attached=true; p.anchor=a; webCount++;
  sThwip(); game.shake=Math.max(game.shake,3);
  popup(p.x, p.y+50, 'THWIP!', '#ffd23f', 26, -.2+Math.random()*.4);
  spawnBurst(a.x,a.y,7,'#ffffff',260,60);
}
function detach(){
  p.attached=false;
  releaseCooldown=.15;
  const sp=Math.hypot(p.vx,p.vy);
  if(p.vy>150 && p.vx>650 && sp>800){
    combo++;
    p.vx*=1.06; p.vy*=1.04;
    const words=['SÜPER!','MÜKEMMEL!','HARİKA!','EFSANE!'];
    popup(p.x, p.y+60, words[Math.min(combo-1,3)]+(combo>1?' x'+combo:''), '#7dff8a', 30, -.1);
    sPerfect();
  } else combo=0;
  p.anchor=null;
}
function leap(){
  p.state='air'; p.vx=480; p.vy=420; sThwip();
  popup(p.x, p.y+60, 'HAYDİ!', '#fff', 24, .1);
}
function startGame(){
  resetRun(); game.state='play';
  hud.style.display='flex'; menuEl.classList.add('hide'); overEl.classList.add('hide');
  if(firstRun){ hintEl.classList.add('show'); firstRun=false; }
}
function restart(){ resetRun(); game.state='play'; overEl.classList.add('hide'); hud.style.display='flex'; }
function toMenu(){
  game.state='menu'; menuEl.classList.remove('hide'); overEl.classList.add('hide');
  hud.style.display='none'; menuBest.textContent='REKOR: '+best+' m';
  anchors.length=0; tokens.length=0; trail.length=0; popups.length=0;
}
function resetRun(){
  p.x=120; p.y=ROOF_TOP+28; p.vx=0; p.vy=0; p.state='stand'; p.attached=false; p.anchor=null;
  anchors=[]; tokens=[]; popups=[]; trail=[];
  startX=120; maxX=120; meters=0; tokenCount=0; webCount=0; combo=0; deadTimer=0;
  holdSeek=false; seekDelay=0; releaseCooldown=0; flash=0;
  game.shake=0; game.night=0;
  camCX = 120 + 200*0.12; camCY = 380;
  genWorld();
  distEl.textContent='0 m'; tokenEl.textContent='0'; bestEl.textContent='REKOR '+best+' m';
}
function doCrash(){
  p.state='dead'; p.attached=false; p.anchor=null; holdSeek=false;
  game.shake=16; flash=.55; sCrash(); deadTimer=0; combo=0;
  crashChunks();
  spawnBurst(p.x, 6, 14, '#cfc8e8', 300, 60);
  const m=Math.floor((maxX-startX)/10);
  const isRec = m>best;
  if(isRec){ best=m; store.set('thwip_best', String(best)); }
  $('overDist').textContent=m+' m'; $('overTok').textContent=tokenCount; $('overWeb').textContent=webCount;
  $('newRec').classList.toggle('hide', !isRec);
}
function popup(x,y,text,c,size,rot){ popups.push({x,y,text,c,size:size||26,rot:rot||0,life:.9,max:.9}); }

/* ================= GİRİŞ ================= */
let pointerDown=false, lastPressAt=0, sawPointer=false;
function press(){
  ensureAudio();
  if(paused){ paused=false; pauseEl.classList.add('hide'); lastT=performance.now(); return; }
  if(game.state==='menu'){ startGame(); leap(); pointerDown=true; holdSeek=true; seekDelay=.18; return; }
  if(game.state==='over'){ if(deadTimer>.8) restart(); return; }
  if(game.state!=='play') return;
  pointerDown=true;
  if(p.state==='stand'){ leap(); holdSeek=true; seekDelay=.18; }
  else if(!p.attached && p.state==='air'){ holdSeek=true; seekDelay=0; }
}
function releaseAct(){
  pointerDown=false; holdSeek=false;
  if(game.state==='play' && p.attached) detach();
}
function onPress(e){
  if(e && e.target && e.target.closest && e.target.closest('button')) return;
  const now=performance.now();
  if(now-lastPressAt<60) return;
  lastPressAt=now;
  press();
}
function onRelease(){ releaseAct(); }
window.addEventListener('pointerdown', e=>{ sawPointer=true; onPress(e); });

/* ================= GÜNCELLEME ================= */
function update(dt){
  game.t+=dt; dtG=dt;
  if(game.state==='menu'){ camCX = game.t*55; camCY = 380; return; }

  updateSparks(dt); updateChunks(dt); updateRings(dt);
  flash*=Math.exp(-dt*4);
  for(let i=0;i<popups.length;i++){ const q=popups[i]; q.life-=dt; q.y+=44*dt; }
  popups=popups.filter(q=>q.life>0);

  if(game.state==='over'){
    if(p.state==='dead'){ deadTimer+=dt; if(deadTimer>.8 && overEl.classList.contains('hide')) overEl.classList.remove('hide'); }
    return;
  }
  if(game.state!=='play') return;

  if(p.state==='stand'){
    p.y = ROOF_TOP+28 + Math.sin(game.t*2.2)*1.5;
  } else if(p.state==='air'){
    if(p.attached){
      const a=p.anchor, dx0=p.x-a.x, dy0=p.y-a.y, d0=Math.hypot(dx0,dy0)||1;
      const nx=dx0/d0, ny=dy0/d0, tx=-ny, ty=nx;
      const vt=p.vx*tx+p.vy*ty; const sg=(Math.abs(vt)<20)?1:Math.sign(vt);
      p.vx+=tx*sg*BOOST*dt; p.vy+=ty*sg*BOOST*dt;
    }
    p.vy-=GRAV*dt;
    const sp0=Math.hypot(p.vx,p.vy);
    if(sp0>MAX_SPEED){ p.vx*=MAX_SPEED/sp0; p.vy*=MAX_SPEED/sp0; }
    p.x+=p.vx*dt; p.y+=p.vy*dt;

    if(p.attached){
      const a=p.anchor, dx=p.x-a.x, dy=p.y-a.y, d=Math.hypot(dx,dy);
      if(d>p.ropeLen){
        const nx=dx/d, ny=dy/d;
        p.x=a.x+nx*p.ropeLen; p.y=a.y+ny*p.ropeLen;
        const vr=p.vx*nx+p.vy*ny;
        if(vr>0){ p.vx-=vr*nx; p.vy-=vr*ny; }
      }
    } else {
      if(seekDelay>0){ seekDelay-=dt; }
      else if(holdSeek && releaseCooldown<=0){
        const a=bestAnchor();
        if(a){ attach(a); holdSeek=false; }
      }
    }
    if(releaseCooldown>0) releaseCooldown-=dt;

    for(let i=0;i<tokens.length;i++){
      const tk=tokens[i];
      if(!tk.taken && Math.hypot(tk.x-p.x, tk.y-p.y)<44){
        tk.taken=true; tokenCount++; tokenEl.textContent=tokenCount; sDing();
        popup(tk.x, tk.y+30, '+1', '#ffd23f', 24, .1);
        ringFx(tk.x,tk.y);
        spawnBurst(tk.x,tk.y,6,'#ffd23f',300,60);
      }
    }
    tokens=tokens.filter(tk=>!tk.taken);

    trail.push({x:p.x, y:p.y}); if(trail.length>24) trail.shift();

    if(p.y < 26){ p.y=26; doCrash(); }
    if(p.x>maxX) maxX=p.x;
    meters = Math.floor((maxX-startX)/10);
    distEl.textContent = meters+' m';
  } else if(p.state==='dead'){
    deadTimer+=dt;
    if(deadTimer>.8 && overEl.classList.contains('hide')) overEl.classList.remove('hide');
  }

  genWorld();
  game.night = clamp(meters/900, 0, 1);
  game.shake *= Math.exp(-dt*6);
}

/* ---- efekt yardımcıları ---- */
function sparkSet(x,y,vx,vy,col){
  if(sparks.length>=SPARK_CAP) sparks.shift();
  sparks.push({x,y,vx,vy,life:.4,max:.4,col});
}
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i]; s.life-=dt;
    if(s.life<=0){ sparks[i]=sparks[sparks.length-1]; sparks.pop(); continue; }
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy-=1100*dt;
  }
  for(let i=0;i<sparks.length;i++){
    const s=sparks[i];
    sparkPos[i*3]=s.x; sparkPos[i*3+1]=s.y; sparkPos[i*3+2]=0;
    sparkCol[i*3]=parseInt(s.col.substr(1,2),16)/255;
    sparkCol[i*3+1]=parseInt(s.col.substr(3,2),16)/255;
    sparkCol[i*3+2]=parseInt(s.col.substr(5,2),16)/255;
  }
  sparkGeo.setDrawRange(0, sparks.length);
  sparkGeo.attributes.position.needsUpdate=true;
  sparkGeo.attributes.color.needsUpdate=true;
}
function crashChunks(){
  for(let i=0;i<chunkPool.length;i++){
    const c2=chunkPool[i];
    c2.m.visible=true; c2.m.position.set(p.x, p.y, 0);
    c2.vx=(Math.random()-.5)*520; c2.vy=Math.random()*430; c2.life=.9; c2.vr=(Math.random()-.5)*12;
  }
}
function updateChunks(dt){
  for(let i=0;i<chunkPool.length;i++){
    const c2=chunkPool[i];
    if(!c2.m.visible) continue;
    c2.life-=dt;
    if(c2.life<=0){ c2.m.visible=false; continue; }
    c2.m.position.x+=c2.vx*dt; c2.m.position.y+=c2.vy*dt; c2.vy-=1100*dt;
    if(c2.m.position.y<2){ c2.m.position.y=2; c2.vy*=-.3; }
    c2.m.rotation.x+=c2.vr*dt; c2.m.rotation.z+=c2.vr*dt;
    const s=Math.max(.15, c2.life/.9);
    c2.m.scale.set(s,s,s);
  }
}
function ringFx(x,y){
  for(let i=0;i<ringPool.length;i++){
    const r=ringPool[i];
    if(!r.m.visible){ r.m.visible=true; r.life=.35; r.m.position.set(x,y,2); r.m.scale.set(1,1,1); break; }
  }
}
function updateRings(dt){
  for(let i=0;i<ringPool.length;i++){
    const r=ringPool[i];
    if(!r.m.visible) continue;
    r.life-=dt;
    if(r.life<=0){ r.m.visible=false; continue; }
    const k=1-r.life/.35;
    r.m.scale.set(1+k*4.5, 1+k*4.5, 1);
    r.m.material.opacity=1-k;
    r.m.quaternion.copy(camera.quaternion);
  }
}

/* ================= SAHNE ÇİZİMİ ================= */
function poolAssign(pool, i0, i1, setup){
  let s=0;
  for(let i=i0;i<=i1 && s<pool.length;i++,s++){ setup(pool[s], i); }
  for(let j=0;j<pool.length;j++) pool[j].visible !== undefined && (pool[j].visible = j<s || (pool[j].g? false : pool[j].visible));
  for(let j=s;j<pool.length;j++){ const it=pool[j]; if(it.g) it.g.visible=false; else it.visible=false; }
  for(let j=0;j<s;j++){ const it=pool[j]; if(it.g) it.g.visible=true; else it.visible=true; }
}

function renderScene(){
  const n=game.night;
  const topC=cssMix([58,36,102],[8,10,34],n), midC=cssMix([157,62,96],[20,18,58],n), botC=cssMix([255,138,66],[40,34,86],n);
  skybg.style.background='linear-gradient(180deg,'+topC+' 0%,'+midC+' 62%,'+botC+' 100%)';

  const speed=Math.hypot(p.vx,p.vy);
  const D=693 + clamp(speed-1300,0,1200)*.05;
  const VIS_H=2*D*Math.tan(Math.PI/6);
  const aspect=W/H, viewW=VIS_H*aspect, halfW=viewW/2;

  /* kamera hedefi */
  let tcx, tcy;
  if(game.state==='menu'){ tcx=camCX; tcy=380; }
  else {
    tcx = p.x + clamp(p.vx*.26,-60,300) + viewW*.12;
    tcy = clamp(p.y + 30 + clamp(p.vy*.08,-70,70), 240, 580);
  }
  const kf=1-Math.exp(-dtG*5);
  camCX+=(tcx-camCX)*kf; camCY+=(tcy-camCY)*kf;

  const shX=(Math.random()-.5)*game.shake, shY=(Math.random()-.5)*game.shake;
  camera.position.set(camCX+shX, camCY+shY, D);
  camera.lookAt(camCX+30, camCY-8, 0);
  const roll = game.state==='play' && p.state==='air' ? clamp(-p.vy*.00004,-.05,.05)+clamp(p.vx*.00001,-.02,.02) : 0;
  camera.rotateZ(roll);
  camera.updateMatrixWorld();

  /* gökyüzü cisimleri */
  fogC = scene.fog || (scene.fog=new THREE.Fog(0x000000, 700, 1900));
  fogC.color.setRGB(lerp(255,40,n)/255, lerp(138,34,n)/255, lerp(66,86,n)/255);
  hemi.intensity=lerp(.95,.5,n);
  dirL.intensity=lerp(1.0,.3,n);
  dirL.position.set(camCX+300, 500, 400);
  hemi.color.setRGB(lerp(255,70,n)/255, lerp(178,80,n)/255, lerp(122,140,n)/255);
  starMat.opacity=clamp((n-.35)/.65,0,1)*.9;
  const sWrap=camCX*.95, gx=sWrap-Math.floor(sWrap/3000)*3000;
  starPts.position.x=gx;
  const cWrap=camCX*.88, cgx=cWrap-Math.floor(cWrap/3000)*3000;
  cloudGrp.position.x=cgx;
  cloudGrp.children.forEach(c2=>{ c2.material.opacity=.13*(1-n*.6); });
  const sunA=1-n*1.15;
  sunM.visible=sunGlow.visible=sunA>0;
  sunM.position.set(camCX*.92, 300-n*380, -1100);
  sunGlow.position.set(sunM.position.x, sunM.position.y, -1099);
  sunM.material.opacity=Math.max(0,sunA);
  sunGlow.material.opacity=Math.max(0,sunA)*.9;
  const ma=clamp((n-.5)*2,0,1);
  moonM.visible=ma>0; moonM.material.opacity=ma;
  moonM.position.set(camCX*.92+300, 260+ma*220, -1100);

  /* binalar */
  farMat.color.setRGB(lerp(46,15,n)/255, lerp(32,15,n)/255, lerp(86,42,n)/255);
  midMat.color.setRGB(lerp(64,24,n)/255, lerp(44,22,n)/255, lerp(120,60,n)/255);
  midMat.emissiveIntensity=.25+.85*n;
  (function(){
    const z=-320, depthFac=(D+320)/D, hw=halfW*depthFac+300;
    const sp=110, i0=Math.floor((camCX-hw)/sp), i1=Math.ceil((camCX+hw)/sp);
    let c2=0;
    for(let i=i0;i<=i1 && c2<48;i++,c2++){
      const h=140+rnd(i,1)*300, w=64+rnd(i,2)*76;
      tmpP.set(i*sp, h/2, z); tmpS.set(w,h,40); tmpQ.identity();
      tmpM.compose(tmpP,tmpQ,tmpS); farIM.setMatrixAt(c2,tmpM);
    }
    farIM.count=c2; farIM.instanceMatrix.needsUpdate=true;
  })();
  let antN=0;
  const antArr=antPts.geometry.attributes.position.array;
  (function(){
    const z=-140, depthFac=(D+140)/D, hw=halfW*depthFac+300;
    const sp=150, i0=Math.floor((camCX-hw)/sp), i1=Math.ceil((camCX+hw)/sp);
    let c2=0;
    for(let i=i0;i<=i1 && c2<30;i++,c2++){
      const h=200+rnd(i,11)*330, w=96+rnd(i,12)*88, x=i*sp+(rnd(i,13)*40-20);
      tmpP.set(x, h/2, z); tmpS.set(w,h,70); tmpQ.identity();
      tmpM.compose(tmpP,tmpQ,tmpS); midIM.setMatrixAt(c2,tmpM);
      if(rnd(i,9)>.62 && antN<30){
        antArr[antN*3]=x+w*.2; antArr[antN*3+1]=h+30; antArr[antN*3+2]=z+36; antN++;
      }
    }
    midIM.count=c2; midIM.instanceMatrix.needsUpdate=true;
    antPts.geometry.setDrawRange(0,antN);
    antPts.geometry.attributes.position.needsUpdate=true;
    antMat.opacity=(.3+.7*n)*(.5+.5*Math.abs(Math.sin(game.t*2)));
  })();

  /* şeritler */
  (function(){
    const sp=70, i0=Math.floor((camCX-halfW-100)/sp), i1=Math.ceil((camCX+halfW+100)/sp);
    let c2=0;
    for(let i=i0;i<=i1 && c2<46;i++,c2++){
      tmpP.set(i*sp, .6, 50); tmpS.set(1,1,1); tmpQ.identity();
      tmpM.compose(tmpP,tmpQ,tmpS); dashIM.setMatrixAt(c2,tmpM);
    }
    dashIM.count=c2; dashIM.instanceMatrix.needsUpdate=true;
  })();

  /* lambalar */
  (function(){
    const sp=460, i0=Math.floor((camCX-halfW*1.2-200)/sp), i1=Math.ceil((camCX+halfW*1.2+200)/sp);
    let s=0;
    for(let i=i0;i<=i1 && s<lampPool.length;i++,s++){
      lampPool[s].g.visible=true; lampPool[s].g.position.x=i*sp+120;
    }
    for(;s<lampPool.length;s++) lampPool[s].g.visible=false;
    lampPool[0].mat.opacity=n*.85;
  })();

  /* tabelalar */
  (function(){
    const k0=Math.floor((camCX-halfW-100)/1000), k1=Math.ceil((camCX+halfW+100)/1000);
    let s=0;
    for(let k=Math.max(1,k0); k<=k1 && s<signPool.length;k++,s++){
      const sg=signPool[s];
      sg.g.visible=true; sg.g.position.x=k*1000;
      if(sg.k!==k){
        sg.k=k;
        const g2=sg.cv.getContext('2d');
        g2.fillStyle='#ffd23f'; g2.fillRect(0,0,160,80);
        g2.strokeStyle='#12071f'; g2.lineWidth=8; g2.strokeRect(4,4,152,72);
        g2.fillStyle='#12071f'; g2.font='44px Bangers, cursive'; g2.textAlign='center'; g2.textBaseline='middle';
        g2.fillText((k*100)+'m', 80, 44);
        sg.tex.needsUpdate=true;
      }
    }
    for(;s<signPool.length;s++) signPool[s].g.visible=false;
  })();

  /* ağ noktaları + ipucu */
  const target=(game.state==='play' && p.state==='air' && !p.attached)? bestAnchor():null;
  (function(){
    let s=0;
    for(let i=0;i<anchors.length && s<anchorPool.length;i++){
      const a=anchors[i];
      if(a.x<camCX-halfW-60||a.x>camCX+halfW+60) continue;
      const m=anchorPool[s++];
      m.visible=true; m.position.set(a.x,a.y,0);
      const pu=1+Math.sin(game.t*4+a.x*.01)*.25;
      m.scale.set(pu,pu,pu);
    }
    for(let j=s;j<anchorPool.length;j++) anchorPool[j].visible=false;
  })();
  if(target){
    hlRing.visible=true;
    hlRing.position.set(target.x,target.y,1);
    const pu=1+Math.sin(game.t*6)*.2;
    hlRing.scale.set(pu,pu,pu);
    hlRing.quaternion.copy(camera.quaternion);
    hintLine.visible=true;
    const hp=hintLine.geometry.attributes.position.array;
    hp[0]=p.x; hp[1]=p.y; hp[2]=0; hp[3]=target.x; hp[4]=target.y; hp[5]=0;
    hintLine.geometry.attributes.position.needsUpdate=true;
    hintLine.computeLineDistances();
  } else { hlRing.visible=false; hintLine.visible=false; }

  /* jetonlar */
  (function(){
    let s=0;
    for(let i=0;i<tokens.length && s<tokenPool.length;i++){
      const tk=tokens[i];
      if(tk.x<camCX-halfW-80||tk.x>camCX+halfW+80) continue;
      const g=tokenPool[s++];
      g.visible=true;
      g.position.set(tk.x, tk.y+Math.sin(game.t*2.4+tk.x*.02)*5, 0);
      g.rotation.y=game.t*3+tk.x*.01;
    }
    for(let j=s;j<tokenPool.length;j++) tokenPool[j].visible=false;
  })();

  /* kahraman */
  let phi=0, pose='stand';
  if(game.state==='menu'){
    const sway=Math.sin(game.t*1.4)*.3;
    const aX=camCX, aY=camCY+VIS_H*.42, L=VIS_H*.3;
    const hx=aX+Math.sin(sway)*L, hy=aY-Math.cos(sway)*L;
    hero.visible=true; hero.position.set(hx,hy,0); phi=sway; pose='swing';
    drawWeb(aX,aY,hx,hy,L,Math.hypot(hx-aX,hy-aY));
  } else if(game.state==='play'||game.state==='over'){
    hero.visible=true;
    hero.position.set(p.x, p.y, 0);
    if(p.state==='dead'){ phi=1.35; pose='dead'; }
    else if(p.state==='stand'){ phi=Math.sin(game.t*2)*.03; pose='stand'; }
    else if(p.attached){
      const a=p.anchor, ux=a.x-p.x, uy=a.y-p.y, dd=Math.hypot(ux,uy)||1;
      phi=Math.atan2(-ux/dd, uy/dd)+Math.sin(game.t*6)*.03; pose='swing';
      const ox=p.x+ux/dd*18, oy=p.y+uy/dd*18;
      drawWeb(a.x,a.y,ox,oy,p.ropeLen,Math.hypot(a.x-ox,a.y-oy));
    } else {
      phi=-clamp(p.vx*.00022,-.35,.45)+Math.sin(game.t*7)*.04; pose='fall';
      webLine.visible=false;
    }
  } else hero.visible=false;
  hero.rotation.z=phi;
  hero.rotation.x=Math.sin(game.t*3)*.05;

  const PT={
    stand:{aL:.25,aR:2.85,lL:.12,lR:-.12,aLx:0,aRx:0,lLx:0,lRx:0},
    swing:{aL:Math.PI-.18,aR:Math.PI+.18,lL:.45,lR:-.3,aLx:.2,aRx:.2,lLx:.4,lRx:.3},
    fall:{aL:-2.1,aR:2.1,lL:.5,lR:-.5,aLx:.15,aRx:.15,lLx:.1,lRx:.1},
    dead:{aL:-2.6,aR:2.6,lL:1.1,lR:-1.1,aLx:0,aRx:0,lLx:0,lRx:0}
  }[pose];
  const lp=1-Math.exp(-dtG*11);
  poseCur.aL=lerp(poseCur.aL,PT.aL,lp); poseCur.aR=lerp(poseCur.aR,PT.aR,lp);
  poseCur.lL=lerp(poseCur.lL,PT.lL,lp); poseCur.lR=lerp(poseCur.lR,PT.lR,lp);
  poseCur.aLx=lerp(poseCur.aLx,PT.aLx,lp); poseCur.aRx=lerp(poseCur.aRx,PT.aRx,lp);
  poseCur.lLx=lerp(poseCur.lLx,PT.lLx,lp); poseCur.lRx=lerp(poseCur.lRx,PT.lRx,lp);
  heroParts.aL.rotation.z=poseCur.aL; heroParts.aR.rotation.z=poseCur.aR;
  heroParts.lL.rotation.z=poseCur.lL; heroParts.lR.rotation.z=poseCur.lR;
  heroParts.aL.rotation.x=poseCur.aLx; heroParts.aR.rotation.x=poseCur.aRx;
  heroParts.lL.rotation.x=poseCur.lLx; heroParts.lR.rotation.x=poseCur.lRx;

  /* iz */
  if(trail.length>2 && (p.state==='air')){
    trailLine.visible=true;
    const tp=trailLine.geometry.attributes.position.array, tc2=trailLine.geometry.attributes.color.array;
    for(let i=0;i<trail.length;i++){
      tp[i*3]=trail[i].x; tp[i*3+1]=trail[i].y; tp[i*3+2]=0;
      const f=i/trail.length*.55;
      tc2[i*3]=f; tc2[i*3+1]=f*.25; tc2[i*3+2]=f*.25;
    }
    trailLine.geometry.setDrawRange(0,trail.length);
    trailLine.geometry.attributes.position.needsUpdate=true;
    trailLine.geometry.attributes.color.needsUpdate=true;
  } else trailLine.visible=false;

  streetMat.color.setRGB(lerp(30,13,n)/255, lerp(25,12,n)/255, lerp(54,30,n)/255);

  renderer.render(scene, camera);
  renderFx(VIS_H);
}
function drawWeb(ax,ay,ox,oy,ropeLen,d){
  webLine.visible=true;
  const arr=webLine.geometry.attributes.position.array;
  const slack=ropeLen-d;
  let pts=2;
  if(slack>6){
    pts=10;
    const mx=(ox+ax)/2, my=(oy+ay)/2-Math.min(60,slack*.5);
    for(let i=0;i<pts;i++){
      const t2=i/(pts-1);
      const x=(1-t2)*(1-t2)*ox + 2*(1-t2)*t2*mx + t2*t2*ax;
      const y=(1-t2)*(1-t2)*oy + 2*(1-t2)*t2*my + t2*t2*ay;
      arr[i*3]=x; arr[i*3+1]=y; arr[i*3+2]=0;
    }
  } else {
    arr[0]=ox; arr[1]=oy; arr[2]=0; arr[3]=ax; arr[4]=ay; arr[5]=0;
  }
  webLine.geometry.setDrawRange(0,pts);
  webLine.geometry.attributes.position.needsUpdate=true;
}

/* ================= 2D FX KATMANI ================= */
function project(x,y){
  tmpV.set(x,y,0).project(camera);
  return {x:(tmpV.x+1)/2*W, y:(1-tmpV.y)/2*H, ok:tmpV.z<1};
}
function renderFx(VIS_H){
  fxctx.setTransform(dpr,0,0,dpr,0,0);
  fxctx.clearRect(0,0,W,H);
  if(game.state==='play' && p.state==='air'){
    const sp=Math.hypot(p.vx,p.vy);
    if(sp>1250){
      const inten=clamp((sp-1250)/1000,0,1), an=Math.atan2(-p.vy,p.vx);
      fxctx.strokeStyle='rgba(255,255,255,'+(.16*inten)+')'; fxctx.lineWidth=2;
      const nn=Math.floor(3+inten*9);
      for(let i=0;i<nn;i++){
        const rx=Math.random()*W, ry=Math.random()*H, len=40+Math.random()*110*inten;
        fxctx.beginPath(); fxctx.moveTo(rx,ry); fxctx.lineTo(rx-Math.cos(an)*len, ry-Math.sin(an)*len); fxctx.stroke();
      }
    }
  }
  for(let i=0;i<popups.length;i++){
    const q=popups[i], k=q.life/q.max;
    const sp2=project(q.x,q.y);
    if(!sp2.ok) continue;
    fxctx.save(); fxctx.translate(sp2.x,sp2.y); fxctx.rotate(q.rot);
    const sc=k>.85? 1+(1-k)*4 : 1;
    fxctx.scale(sc,sc);
    const fs=q.size*H/VIS_H;
    fxctx.font=fs+'px Bangers, "Comic Sans MS", cursive'; fxctx.textAlign='center'; fxctx.textBaseline='middle';
    fxctx.globalAlpha=Math.min(1,k*2);
    fxctx.lineWidth=5; fxctx.strokeStyle='#12071f'; fxctx.strokeText(q.text,0,0);
    fxctx.fillStyle=q.c; fxctx.fillText(q.text,0,0);
    fxctx.restore();
  }
  fxctx.globalAlpha=1;
  if(flash>0.01){ fxctx.fillStyle='rgba(230,36,41,'+flash*.5+')'; fxctx.fillRect(0,0,W,H); }
  fxctx.fillStyle=vignette; fxctx.fillRect(0,0,W,H);
}

/* ================= DÖNGÜ ================= */
function loop(ts){
  requestAnimationFrame(loop);
  try{
    if(!renderer) return;
    if(!lastT) lastT=ts;
    let dt=(ts-lastT)/1000; lastT=ts;
    if(paused) return;
    dt=Math.min(dt,.032);
    update(dt);
    renderScene();
  }catch(err){
    showErr(err && err.message ? err.message : String(err));
  }
}
if(window.THREE){
  try{ initThree(); requestAnimationFrame(loop); }
  catch(e){ showErr(e.message||String(e)); }
}
})();
</script>
